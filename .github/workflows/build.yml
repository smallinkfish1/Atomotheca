# ============================================================
#  Molecule Viewer — 自动构建与发布（Linux + Windows）
#
#  本版改动：
#    1. 移除 Web(WASM) job —— 先保证桌面两端能出包
#    2. vcpkg 改用 --classic，避免 manifest 模式直接报错
#    3. 统一 MSVC 运行时为 /MT（与 x64-windows-static 匹配）
#    4. dumpbin 依赖检查改为"只打印"，不再导致构建失败
#
#  触发：
#    push 到 main     → 编译验证，不发版
#    push v* tag      → 编译 + 创建 Release
#    手动             → 只编译
# ============================================================

name: Build & Release

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  IMGUI_VERSION: v1.90.9
  # 关掉 vcpkg 的二进制缓存提示，日志更干净
  VCPKG_DISABLE_METRICS: 1

jobs:
  # ==========================================================
  #  Linux
  # ==========================================================
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libglfw3-dev libgl1-mesa-dev libglm-dev

      - name: 拉取 Dear ImGui
        run: |
          git clone --depth 1 --branch "$IMGUI_VERSION" \
            https://github.com/ocornut/imgui.git external/imgui

      - name: 打印环境信息
        run: |
          cmake --version | head -1
          g++ --version | head -1

      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build -j"$(nproc)"

      - name: 打包
        run: |
          mkdir -p dist/molecule-viewer-linux/src
          cp build/molecule_viewer dist/molecule-viewer-linux/
          cp -r assets            dist/molecule-viewer-linux/
          cp -r src/shaders       dist/molecule-viewer-linux/src/
          cp README.md LICENSE    dist/molecule-viewer-linux/
          tar -czf molecule-viewer-linux-x86_64.tar.gz -C dist molecule-viewer-linux
          echo "--- 包内容 ---"
          tar -tzf molecule-viewer-linux-x86_64.tar.gz | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: molecule-viewer-linux-x86_64.tar.gz
          if-no-files-found: error

  # ==========================================================
  #  Windows
  # ==========================================================
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 拉取 Dear ImGui
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:IMGUI_VERSION https://github.com/ocornut/imgui.git external/imgui
          if (-not (Test-Path "external/imgui/imgui.h")) { throw "ImGui 拉取失败" }

      - name: 缓存 vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: vcpkg-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: vcpkg-windows-

      # --classic：不加这个，新版 vcpkg 在仓库里找不到 vcpkg.json
      # 会直接报 "Could not locate a manifest" 并退出
      - name: 安装依赖（静态三重态）
        shell: pwsh
        run: |
          vcpkg version

          vcpkg install --classic glfw3:x64-windows-static glm:x64-windows-static

          # 老版本 vcpkg 可能不认识 --classic，回退一次
          if ($LASTEXITCODE -ne 0) {
            Write-Host "带 --classic 失败，改用普通模式重试"
            vcpkg install glfw3:x64-windows-static glm:x64-windows-static
          }

          if ($LASTEXITCODE -ne 0) { throw "vcpkg install 失败，退出码 $LASTEXITCODE" }

      - name: 配置
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败" }

      - name: 编译
        shell: pwsh
        run: |
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw "编译失败" }

      # 诊断信息，只打印，不参与成败判断
      - name: 打印 DLL 依赖（仅供参考）
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "build\Release\molecule_viewer.exe"
          if (Test-Path $exe) {
            Get-Item $exe | Format-List Name, Length
            if (Get-Command dumpbin -ErrorAction SilentlyContinue) {
              dumpbin /dependents $exe
            } else {
              Write-Host "dumpbin 不可用，跳过依赖检查"
            }
          }

      - name: 打包
        shell: pwsh
        run: |
          $exe = "build\Release\molecule_viewer.exe"
          if (-not (Test-Path $exe)) { throw "没有找到 $exe，编译可能没真正产出" }

          $dir = "dist\molecule-viewer-win64"
          New-Item -ItemType Directory -Force -Path "$dir\src" | Out-Null
          Copy-Item $exe                     $dir\
          Copy-Item -Recurse assets          "$dir\assets"
          Copy-Item -Recurse src\shaders     "$dir\src\shaders"
          Copy-Item README.md, LICENSE       $dir\
          Compress-Archive -Path $dir -DestinationPath molecule-viewer-win64.zip -Force

          Get-ChildItem molecule-viewer-win64.zip | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: molecule-viewer-win64.zip
          if-no-files-found: error

  # ==========================================================
  #  Release（只在 tag 时执行）
  # ==========================================================
  release:
    name: Publish Release
    needs: [ linux, windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 收集发布包
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} out/ \;
          echo "--- 将发布以下文件 ---"
          ls -lh out/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
