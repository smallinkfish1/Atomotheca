# ============================================================
#  Atomotheca — 自动构建与发布（Linux + Windows MSVC + Windows MinGW）
#
#  本版改动：
#  1. windows-mingw 不再用 git clone 拉依赖，改用 actions/checkout
#     → 彻底摆脱对 MSYS2 里 git 包的依赖（这就是之前 command not found 的原因）
#  2. GLM 在 MinGW job 里显式检出，避免 CMake fallback 到主机路径
#  3. 其余 job 与原版保持一致
#
#  触发：
#    push 到 main → 编译验证，不发版
#    push v* tag  → 编译 + 创建 Release
#    手动         → 只编译
#
#  Release 描述来源：
#    devlog/dayNN-*/releasenote.md 里 version 与 tag 相同的文件，按天顺序拼接。
#    一个版本跨多天（如 v0.2.0 含 Day 15–18）会把这几天的说明都带上。
#    一个都没匹配到时，退回 GitHub 的自动生成说明（按 commit 标题）。
# ============================================================

name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  IMGUI_VERSION: v1.90.9
  GLFW_VERSION: 3.4
  GLM_VERSION: 1.0.1

  # 关掉 vcpkg 的二进制缓存提示，日志更干净
  VCPKG_DISABLE_METRICS: 1

jobs:

  # ==========================================================
  #  Linux
  # ==========================================================
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libglfw3-dev libgl1-mesa-dev libglm-dev

      - name: 拉取 Dear ImGui
        run: |
          git clone --depth 1 --branch "$IMGUI_VERSION" \
            https://github.com/ocornut/imgui.git external/imgui

      - name: 打印环境信息
        run: |
          cmake --version | head -1
          g++ --version | head -1

      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build -j"$(nproc)"

      - name: 打包
        run: |
          mkdir -p dist/molecule-viewer-linux/src
          cp build/molecule_viewer dist/molecule-viewer-linux/
          cp -r assets dist/molecule-viewer-linux/
          cp -r src/shaders dist/molecule-viewer-linux/src/
          cp README.md LICENSE dist/molecule-viewer-linux/
          tar -czf molecule-viewer-linux-x86_64.tar.gz -C dist molecule-viewer-linux
          echo "--- 包内容 ---"
          tar -tzf molecule-viewer-linux-x86_64.tar.gz | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: molecule-viewer-linux-x86_64.tar.gz
          if-no-files-found: error

  # ==========================================================
  #  Windows（MSVC + vcpkg）
  # ==========================================================
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取 Dear ImGui
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:IMGUI_VERSION https://github.com/ocornut/imgui.git external/imgui
          if (-not (Test-Path "external/imgui/imgui.h")) { throw "ImGui 拉取失败" }

      - name: 缓存 vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: vcpkg-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: vcpkg-windows-

      # --classic：不加这个，新版 vcpkg 在仓库里找不到 vcpkg.json
      # 会直接报 "Could not locate a manifest" 并退出
      - name: 安装依赖（静态三重态）
        shell: pwsh
        run: |
          vcpkg version
          vcpkg install --classic glfw3:x64-windows-static glm:x64-windows-static
          if ($LASTEXITCODE -ne 0) {
            Write-Host "带 --classic 失败，改用普通模式重试"
            vcpkg install glfw3:x64-windows-static glm:x64-windows-static
          }
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install 失败，退出码 $LASTEXITCODE" }

      - name: 配置
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败" }

      - name: 编译
        shell: pwsh
        run: |
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw "编译失败" }

      - name: 打印 DLL 依赖（仅供参考）
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "build\Release\molecule_viewer.exe"
          if (Test-Path $exe) {
            Get-Item $exe | Format-List Name, Length
            if (Get-Command dumpbin -ErrorAction SilentlyContinue) {
              dumpbin /dependents $exe
            } else {
              Write-Host "dumpbin 不可用，跳过依赖检查"
            }
          }

      - name: 打包
        shell: pwsh
        run: |
          $exe = "build\Release\molecule_viewer.exe"
          if (-not (Test-Path $exe)) { throw "没有找到 $exe，编译可能没真正产出" }
          $dir = "dist\molecule-viewer-win64"
          New-Item -ItemType Directory -Force -Path "$dir\src" | Out-Null
          Copy-Item $exe $dir\
          Copy-Item -Recurse assets "$dir\assets"
          Copy-Item -Recurse src\shaders "$dir\src\shaders"
          Copy-Item README.md, LICENSE $dir\
          Compress-Archive -Path $dir -DestinationPath molecule-viewer-win64.zip -Force
          Get-ChildItem molecule-viewer-win64.zip | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: molecule-viewer-win64.zip
          if-no-files-found: error

  # ==========================================================
  #  Windows（MinGW-w64）
  #
  #  依赖为什么不用 git clone：
  #    msys2/setup-msys2 装出来的环境是隔离的，PATH 里没有 runner
  #    自带的 git。一旦 install 列表漏掉 git，clone 就报 exit 127。
  #    改用 actions/checkout 检出到子目录，完全不调用 git 命令，
  #    既不会缺依赖，也自带重试和浅克隆。
  # ==========================================================
  windows-mingw:
    name: Windows x64 (MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MSYS2 / MinGW-w64 工具链
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            zip

      # 不依赖 MSYS2 里的 git：用 checkout 把仓库检出到指定子目录
      - name: 拉取 Dear ImGui
        uses: actions/checkout@v4
        with:
          repository: ocornut/imgui
          ref: ${{ env.IMGUI_VERSION }}
          path: external/imgui

      - name: 拉取 GLFW
        uses: actions/checkout@v4
        with:
          repository: glfw/glfw
          ref: ${{ env.GLFW_VERSION }}
          path: external/glfw

      - name: 拉取 GLM
        uses: actions/checkout@v4
        with:
          repository: g-truc/glm
          ref: ${{ env.GLM_VERSION }}
          path: external/glm

      - name: 打印环境信息
        run: |
          cmake --version | head -1
          g++ --version | head -1
          g++ -dumpmachine
          ls external

      - name: 配置
        run: cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build-mingw

      - name: 检查依赖（只打印）
        continue-on-error: true
        run: |
          objdump -p build-mingw/molecule_viewer.exe | grep "DLL Name" | sort -u

      - name: 打包
        run: |
          dir=dist/molecule-viewer-win64-mingw
          mkdir -p "$dir/src"
          cp build-mingw/molecule_viewer.exe "$dir/"
          cp -r assets "$dir/assets"
          cp -r src/shaders "$dir/src/shaders"
          cp README.md LICENSE "$dir/"
          (cd dist && zip -r ../molecule-viewer-win64-mingw.zip molecule-viewer-win64-mingw)
          echo "--- 包内容 ---"
          unzip -l molecule-viewer-win64-mingw.zip | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: windows-mingw
          path: molecule-viewer-win64-mingw.zip
          if-no-files-found: error

  # ==========================================================
  #  Release（只在 tag 时执行）
  # ==========================================================
  release:
    name: Publish Release
    needs: [ linux, windows, windows-mingw ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 需要仓库文件：Release 正文从 devlog/dayNN-*/releasenote.md 里读
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 收集发布包
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} out/ \;
          echo "--- 将发布以下文件 ---"
          ls -lh out/

      # 正文 = 所有 version 与 tag 一致的 releasenote.md，按天顺序拼接。
      # 找不到就 matched=0，由下一步退回 GitHub 自动生成的说明。
      - name: 汇总 devlog 里的 Release 说明
        id: notes
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # v0.3.0-rc1 这类预发布也认 0.3.0 的说明：去掉 -rc / -beta 后缀
          TAG_VERSION="${TAG_VERSION%%-*}"
          echo "tag = ${GITHUB_REF_NAME}，按 version = ${TAG_VERSION} 找说明"
          : > release-body.md
          matched=0
          for f in $(find devlog -maxdepth 2 -name releasenote.md | sort); do
            ver=$(sed -n 's/^version:[[:space:]]*//p' "$f" | head -1 | tr -d '[:space:]')
            if [ "$ver" != "$TAG_VERSION" ]; then
              continue
            fi
            title=$(sed -n 's/^title:[[:space:]]*//p' "$f" | head -1)
            if [ "$matched" = "1" ]; then
              printf '\n---\n\n' >> release-body.md
            fi
            printf '## %s\n\n' "$title" >> release-body.md
            # 跳过 front matter、去掉开头的空行、把正文的 ## 降一级挂到「第 N 天」下面
            awk '
              /^---[[:space:]]*$/ { if (n < 2) { n++; next } }
              (n >= 2 || n == 0) {
                if (!seen && $0 ~ /^[[:space:]]*$/) next
                seen = 1
                if ($0 ~ /^## /) { print "#" $0; next }
                print
              }
            ' "$f" >> release-body.md
            echo "  + $f（${title}）"
            matched=1
          done
          echo "matched=$matched" >> "$GITHUB_OUTPUT"
          if [ "$matched" = "1" ]; then
            echo "--- 生成的 Release 正文 ---"
            cat release-body.md
          else
            echo "没有 version=${TAG_VERSION} 的 releasenote.md，退回自动生成的说明"
          fi

      - name: 创建 Release（用 devlog 里的说明）
        if: steps.notes.outputs.matched == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: release-body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

      - name: 创建 Release（没有说明时自动生成）
        if: steps.notes.outputs.matched != '1'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
